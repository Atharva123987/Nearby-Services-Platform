name: fieldguide

# Works without a .env file (defaults below); copy .env.example to .env to override.

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 10

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldguide}
      POSTGRES_DB: ${POSTGRES_DB:-fieldguide}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Service hostnames inside the compose network override any localhost values in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fieldguide}:${POSTGRES_PASSWORD:-fieldguide}@db:5432/${POSTGRES_DB:-fieldguide}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      # Cache is best-effort: start once Redis has started, don't block on its health.
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
